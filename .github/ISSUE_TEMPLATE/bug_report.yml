name: Bug report
description: Report a reproducible Columbus bug.
title: "fix: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include enough detail for maintainers to reproduce it locally.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This is about Columbus indexing, search, memory, CLI output, or local project state.
          required: true
        - label: This is not about LLM behavior, agent orchestration, hooks, guardrails, or editor integration policy.
          required: true

  - type: textarea
    id: current-behavior
    attributes:
      label: Current behavior
      description: What happened?
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include exact commands and a minimal repository or fixture if possible.
      placeholder: |
        1. Run `columbus init`
        2. Run `columbus index`
        3. Run `columbus search "..."`
        4. See error
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Paste the relevant output from `columbus version` and `columbus doctor`.
      value: |
        - Columbus version:
        - OS:
        - Go version, if built from source:
        - Shell:
        - `git --version`:
        - `rg --version`, if installed:
      render: markdown
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Paste terminal output, JSON output, stack traces, or screenshots that help explain the issue.
      render: shell

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Anything else maintainers should know?
