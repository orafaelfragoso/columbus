name: ci

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: Fetch model assets
        run: make fetch-model
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m --build-tags fts5 ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Fetch model assets
        run: make fetch-model
      - name: Vet
        run: go vet -tags fts5 ./...
      - name: Test (race)
        run: go test -tags fts5 -race -timeout 300s ./...

  smoke:
    # End-to-end guard for the semantic chain: build the full binary, onboard a
    # fixture repo and confirm search returns a vector-backed hit.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: Fetch model assets
        run: make fetch-model
      - name: Build
        run: go build -tags fts5 -o columbus ./cmd/columbus
      - name: Smoke test
        run: bash scripts/smoke.sh "${{ github.workspace }}/columbus"

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: Fetch model assets
        run: make fetch-model
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck -tags fts5 ./...
