name: pr-title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'

          if [[ "$PR_TITLE" =~ $pattern ]]; then
            exit 0
          fi

          cat <<'EOF'
          Pull request titles must follow Conventional Commits:

            <type>(<optional-scope>): <description>

          Allowed types: feat, fix, perf, refactor, docs, test, build, ci, chore, revert.
          Examples:
            feat(search): add graph enrichment
            fix(store): avoid nested transaction deadlock
            docs: update install instructions
          EOF
          exit 1
