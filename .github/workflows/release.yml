name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      # Zig is only the C cross-compiler for linux cgo builds (tree-sitter).
      # The embedding and SQLite/vector stack no longer need native libraries.
      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASER_TOKEN }}
          ZIG_LOCAL_CACHE_DIR: ${{ runner.temp }}/zig-local-cache
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-global-cache
