name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    # macOS runner: darwin builds natively with Apple clang+SDK, linux builds
    # via zig cc. zig cannot cross-compile darwin (needs Apple system libs it
    # doesn't bundle), so building darwin natively here is what makes the
    # release reliable. zig -> linux is self-contained and needs no macOS SDK.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      # zig provides the C cross-compiler for the linux cgo targets (darwin is
      # built natively with the runner's Apple clang).
      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASER_TOKEN }}
          # cgo invokes `zig cc` from Go's read-only stdlib cwd, so zig cannot
          # create its default local cache there (AccessDenied). setup-zig v2 no
          # longer sets these for us (v1 did), so point both caches at a writable
          # dir explicitly.
          ZIG_LOCAL_CACHE_DIR: ${{ runner.temp }}/zig-local-cache
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-global-cache
