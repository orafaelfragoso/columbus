version: 2

project_name: columbus

before:
  hooks:
    - go mod tidy

builds:
  - id: columbus
    main: ./cmd/columbus
    binary: columbus
    builder: go
    env:
      - CGO_ENABLED=1
    flags:
      - -tags=fts5
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    # This pipeline runs on a macOS runner (see release.yml):
    #   - darwin builds natively with Apple clang+SDK (handles both arches via
    #     -arch). zig CANNOT cross-compile darwin reliably: macOS needs Apple
    #     system libs (libresolv, frameworks) it doesn't bundle, so it fails
    #     with "AccessDenied" (no SDK on Linux) or "unable to find ... 'resolv'".
    #   - linux builds via zig cc, which ships a self-contained C toolchain and
    #     needs no macOS SDK. Only linux needs an override; darwin uses host cc.
    overrides:
      - goos: linux
        goarch: amd64
        env:
          - CC=zig cc -target x86_64-linux-gnu
          - CXX=zig c++ -target x86_64-linux-gnu
      - goos: linux
        goarch: arm64
        env:
          - CC=zig cc -target aarch64-linux-gnu
          - CXX=zig c++ -target aarch64-linux-gnu

archives:
  - id: default
    ids:
      - columbus
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\([^)]+\))?!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([^)]+\))?!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\([^)]+\))?!?:.+$'
      order: 2
    - title: Refactoring
      regexp: '^.*?refactor(\([^)]+\))?!?:.+$'
      order: 3
    - title: Documentation
      regexp: '^.*?docs(\([^)]+\))?!?:.+$'
      order: 4
    - title: Tests
      regexp: '^.*?test(\([^)]+\))?!?:.+$'
      order: 5
    - title: Build and CI
      regexp: '^.*?(build|ci)(\([^)]+\))?!?:.+$'
      order: 6
    - title: Maintenance
      regexp: '^.*?chore(\([^)]+\))?!?:.+$'
      order: 7
    - title: Reverts
      regexp: '^.*?revert(\([^)]+\))?!?:.+$'
      order: 8
    - title: Other Changes
      order: 999
  filters:
    exclude:
      - "^Merge pull request"
      - "^Merge branch"

release:
  draft: false
  prerelease: auto
