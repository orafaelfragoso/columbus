version: 2

project_name: columbus

before:
  hooks:
    # The model weights are embedded via //go:embed; fetch them before any build
    # so the embed package compiles (the build fails loudly if absent).
    - make fetch-model
    - go mod tidy

builds:
  - id: columbus
    main: ./cmd/columbus
    binary: columbus
    builder: go
    env:
      - CGO_ENABLED=1
    flags:
      - -tags=fts5
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    # Tree-sitter keeps the binary on cgo. Linux cross-builds use Zig as a C
    # compiler only; no C++ linker wrapper or native embedding libs are needed.
    overrides:
      - goos: linux
        goarch: amd64
        env:
          - "CC=zig cc -target x86_64-linux-gnu"
      - goos: linux
        goarch: arm64
        env:
          - "CC=zig cc -target aarch64-linux-gnu"

archives:
  - id: default
    ids:
      - columbus
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    # Vectors are not shipped; `columbus reindex` rebuilds them locally.
    files:
      - LICENSE

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\([^)]+\))?!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([^)]+\))?!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\([^)]+\))?!?:.+$'
      order: 2
    - title: Refactoring
      regexp: '^.*?refactor(\([^)]+\))?!?:.+$'
      order: 3
    - title: Documentation
      regexp: '^.*?docs(\([^)]+\))?!?:.+$'
      order: 4
    - title: Tests
      regexp: '^.*?test(\([^)]+\))?!?:.+$'
      order: 5
    - title: Build and CI
      regexp: '^.*?(build|ci)(\([^)]+\))?!?:.+$'
      order: 6
    - title: Maintenance
      regexp: '^.*?chore(\([^)]+\))?!?:.+$'
      order: 7
    - title: Reverts
      regexp: '^.*?revert(\([^)]+\))?!?:.+$'
      order: 8
    - title: Other Changes
      order: 999
  filters:
    exclude:
      - "^Merge pull request"
      - "^Merge branch"

release:
  draft: false
  prerelease: auto
  # release-please creates the GitHub Release (with the changelog as its body)
  # when it tags the version. GoReleaser only attaches binaries here, so keep the
  # existing notes instead of overwriting them.
  mode: keep-existing
